{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align: center; background: linear-gradient(135deg, #dc3545, #c82333); color: white;">
    <i class="fas fa-times-circle" style="font-size: 5rem; margin-bottom: 1rem;"></i>
    <h2>QR code invalide</h2>
    <p>Ce QR code a expiré ou n'est pas valide.</p>
    <p>Veuillez scanner un QR code actif généré par votre professeur.</p>
    <a href="{{ url_for('index') }}" class="btn" style="margin-top: 1rem; background: white; color: #dc3545;">
        <i class="fas fa-home"></i> Retour à l'accueil
    </a>
</div>
{% endblock %}
