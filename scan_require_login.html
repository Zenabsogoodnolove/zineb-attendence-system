{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align: center;">
    <i class="fas fa-sign-in-alt" style="font-size: 5rem; color: var(--iscae-blue); margin-bottom: 1rem;"></i>
    <h2>Connexion requise</h2>
    <p>Vous devez être connecté avec votre compte étudiant pour valider votre présence.</p>
    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
        <a href="{{ url_for('login', next=request.path) }}" class="btn">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </a>
        <a href="{{ url_for('register') }}" class="btn btn-outline">
            <i class="fas fa-user-plus"></i> Créer un compte
        </a>
    </div>
</div>
{% endblock %}
