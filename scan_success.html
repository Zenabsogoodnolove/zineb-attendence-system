{% extends "base.html" %}

{% block content %}
<div class="card" style="text-align: center; background: linear-gradient(135deg, #28a745, #20c997); color: white;">
    <i class="fas fa-check-circle" style="font-size: 5rem; margin-bottom: 1rem;"></i>
    <h2>Présence enregistrée !</h2>
    <p>Votre présence a bien été validée.</p>
    {% if absences and threshold %}
    <p style="margin-top: 1rem;">Vous avez {{ absences }} absence(s) sur {{ threshold }} autorisées.</p>
    {% endif %}
    <a href="{{ url_for('student_dashboard') }}" class="btn" style="margin-top: 1rem; background: white; color: #28a745;">
        <i class="fas fa-tachometer-alt"></i> Voir mon tableau de bord
    </a>
</div>
{% endblock %}
